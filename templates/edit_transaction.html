{% extends "base.html" %}

{% block title %}Edit Transaction — Finance Tracker{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Edit Transaction</h1>
    <p class="text-muted">Update the details below and save your changes.</p>

    <form method="POST"
          action="{{ url_for('edit_transaction', transaction_id=transaction.id) }}"
          novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label">Type</label>
            <div class="radio-row">
                <label class="radio-option">
                    <input type="radio" name="type" value="EXPENSE"
                           {% if transaction.type == 'EXPENSE' %}checked{% endif %}>
                    <span>Expense</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="type" value="INCOME"
                           {% if transaction.type == 'INCOME' %}checked{% endif %}>
                    <span>Income</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="category_id">Category</label>
            <select class="form-select" id="category_id" name="category_id" required>
                <option value="">Select a category…</option>
                {% for c in categories %}
                    <option value="{{ c.id }}" data-type="{{ c.type }}"
                        {% if c.id == transaction.category_id %}selected{% endif %}>
                        {{ c.name }} ({{ c.type|capitalize }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="amount">Amount (₦)</label>
            <input class="form-input" type="number" id="amount" name="amount"
                   min="0.01" step="0.01" placeholder="0.00"
                   value="{{ transaction.amount }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <input class="form-input" type="text" id="description" name="description"
                   maxlength="255" placeholder="e.g. October salary"
                   value="{{ transaction.description or '' }}">
        </div>

        <div class="form-group">
            <label class="form-label" for="transaction_date">Date</label>
            <input class="form-input" type="date" id="transaction_date" name="transaction_date"
                   value="{{ transaction.transaction_date }}" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
    </form>

    <p class="text-muted mt-6" style="text-align: center; font-size: 0.9375rem;">
        <a href="{{ url_for('transactions') }}">← Back to transactions</a>
    </p>
</section>
{% endblock %}
