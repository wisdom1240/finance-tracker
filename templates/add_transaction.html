{% extends "base.html" %}

{% block title %}Add Transaction — Finance Tracker{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Add Transaction</h1>
    <p class="text-muted">Record an income or expense.</p>

    <form method="POST" action="{{ url_for('add_transaction') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label">Type</label>
            <div class="radio-row">
                <label class="radio-option">
                    <input type="radio" name="type" value="EXPENSE"
                           {% if form_data and form_data.type == 'EXPENSE' %}checked{% endif %}
                           {% if not form_data %}checked{% endif %}>
                    <span>Expense</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="type" value="INCOME"
                           {% if form_data and form_data.type == 'INCOME' %}checked{% endif %}>
                    <span>Income</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="category_id">Category</label>
            <select class="form-select" id="category_id" name="category_id" required>
                <option value="">Select a category…</option>
                {% for c in categories %}
                    <option value="{{ c.id }}" data-type="{{ c.type }}"
                        {% if form_data and form_data.category_id == c.id %}selected{% endif %}>
                        {{ c.name }} ({{ c.type|capitalize }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="amount">Amount (₦)</label>
            <input class="form-input" type="number" id="amount" name="amount"
                   min="0.01" step="0.01" placeholder="0.00"
                   value="{{ form_data.amount if form_data else '' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <input class="form-input" type="text" id="description" name="description"
                   maxlength="255" placeholder="e.g. October salary"
                   value="{{ form_data.description if form_data else '' }}">
        </div>

        <div class="form-group">
            <label class="form-label" for="transaction_date">Date</label>
            <input class="form-input" type="date" id="transaction_date" name="transaction_date"
                   value="{{ form_data.transaction_date if form_data else today }}" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save transaction</button>
    </form>

    <p class="text-muted mt-6" style="text-align: center; font-size: 0.9375rem;">
        <a href="{{ url_for('dashboard') }}">← Back to dashboard</a>
    </p>
</section>
{% endblock %}
